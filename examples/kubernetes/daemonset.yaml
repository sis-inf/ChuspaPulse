apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: chuspapulse
  labels:
    app: chuspapulse
spec:
  selector:
    matchLabels:
      app: chuspapulse
  template:
    metadata:
      labels:
        app: chuspapulse
    spec:
      containers:
        - name: chuspapulse
          image: chuspapulse:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: metrics

          volumeMounts:
            - name: storage
              mountPath: /data

      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: chuspapulse-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chuspapulse-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
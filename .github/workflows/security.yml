name: Security scan

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev] # CAMBIO 1: El issue pide que el PR sea contra dev, no main

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: cpp # CAMBIO 2: Cambiado de javascript-typescript a cpp
          # build-mode: manual # Descomenta esto si la compilación automática falla

      - name: Compilar proyecto C++
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev
          cmake -B build -S .
          cmake --build build --parallel

      - name: Análisis de CodeQL
        uses: github/codeql-action/analyze@v4.39.1

      - name: Escaneo de dependencias con OSV-Scanner
        uses: google/osv-scanner-action/scan@v1
        with:
          scan-args: |-
            --recursive
            --severity=HIGH,CRITICAL
            .
name: CI
on:
  pull_request:
    branches: [dev, main]
jobs:
  validar-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar descripción del PR
        run: |
          if [ -z "${{ github.event.pull_request.body }}" ]; then
            echo "El PR debe tener descripción"
            exit 1
          fi
          echo "✅ PR tiene descripción"
      - name: Verificar que referencia un issue
        run: |
          if ! echo "${{ github.event.pull_request.body }}" | grep -qi "closes #\|fixes #\|refs #"; then
            echo "El PR debe referenciar un issue con 'Closes #N'"
            exit 1
          fi
          echo "✅ PR referencia un issue"
      - name: Verificar actualización de CHANGELOG
        run: |
          LABELS="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
  
          if echo "$LABELS" | grep -qw "skip-changelog"; then
            echo "✅ Verificación omitida por etiqueta skip-changelog"
            exit 0
          fi
  
          git fetch origin ${{ github.base_ref }}

          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          if echo "$CHANGED_FILES" | grep -q "^src/"; then
            if ! echo "$CHANGED_FILES" | grep -qx "CHANGELOG.md"; then
              echo "❌ Este PR modifica archivos en src/ pero no actualiza CHANGELOG.md."
              echo "Agrega una entrada al CHANGELOG o aplica la etiqueta skip-changelog si corresponde."
              exit 1
            fi
          fi

          echo "✅ Verificación de CHANGELOG superada"
  build-and-test:
    needs: validar-pr
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev libsqlite3-dev
      - name: Configurar CMake con tests
        run: cmake -S . -B build -DBUILD_TESTS=ON -DCMAKE_CXX_FLAGS="-Wall -Wextra"
      - name: Compilar
        run: cmake --build build
      - name: Install clang-tidy
        run: |
          sudo apt update
          sudo apt install -y clang-tidy-14
          sudo ln -sf /usr/bin/clang-tidy-14 /usr/bin/clang-tidy
      - name: Run clang-tidy
        run: |
          find src/ -name "*.cpp" -o -name "*.cxx" -o -name "*.cc" | \
          xargs clang-tidy --config-file=.clang-tidy --warnings-as-errors='' -- -std=c++17
      - name: Ejecutar tests con ctest
        run: cd build && ctest --output-on-failure
    - name: Ejecutar detección de memory leaks con Valgrind
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          for test_bin in ./build/tests/test_*; do
            if [ -x "$test_bin" ]; then
              echo "Ejecutando Valgrind en $test_bin..."
              valgrind --leak-check=full --error-exitcode=1 "$test_bin"
            fi
          done